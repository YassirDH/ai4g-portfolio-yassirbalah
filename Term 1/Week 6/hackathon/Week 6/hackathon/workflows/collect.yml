# The "alarm clock" of the Maintainer Pressure Meter.
# Every 15 minutes GitHub starts a fresh machine (a "runner"),
# runs collect.py and commits the new data back to the repo.

name: Collect comments

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC; GitHub may delay or skip runs under load)
  workflow_dispatch:          # "Run workflow" button for a manual run

permissions:
  contents: write             # needed to commit the data back

concurrency:
  group: collector            # never two runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Restore Hugging Face model from cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-twitter-roberta-sentiment-latest

      - name: Fetch comments and score sentiment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
        run: python collect.py

      - name: Save new data to the repo
        run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "data: run $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
